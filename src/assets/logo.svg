<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A1F" />
      <stop offset="100%" stop-color="#FF7A45" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="#121214" stroke="url(#logo-orange)" stroke-width="4"/>
  <!-- Decorative screen shape resembling a YouTube thumbnail aspect ratio border -->
  <rect x="15" y="20" width="70" height="40" rx="6" fill="none" stroke="#F8FAFC" stroke-width="2" opacity="0.3" />
  <!-- Play arrow -->
  <polygon points="45,32 60,40 45,48" fill="url(#logo-orange)"/>
  <!-- N logo outline -->
  <path d="M25,75 L25,55 L35,55 M75,75 L75,55 L65,55" fill="none" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" />
  <!-- Underline accent -->
  <line x1="20" y1="80" x2="80" y2="80" stroke="url(#logo-orange)" stroke-width="6" stroke-linecap="round" />
</svg>
